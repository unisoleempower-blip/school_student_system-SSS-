version: '3.8'

# ==============================================================================
# HAPS-AI SCHOLAR ASSISTANT: PRODUCTION DOCKER COMPOSE CONFIGURATION
# Hardened for Him Academy Public School Production Server Deployment
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: haps-prod-postgres
    restart: always
    environment:
      POSTGRES_DB: haps_scholar_prod
      POSTGRES_USER: ${PROD_DB_USER:-haps_prod_admin}
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD:?Database password must be set in production}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 4096M
        reservations:
          cpus: '0.50'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - haps-prod-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: haps-prod-kafka
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_LOG_RETENTION_HOURS: 168 # 7 days retention for school telemetry
    volumes:
      - prod_kafka_data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 3072M
    networks:
      - haps-prod-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: haps-scholar-assistant/backend:latest
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://${PROD_DB_USER:-haps_prod_admin}:${PROD_DB_PASSWORD}@postgres:5432/haps_scholar_prod
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${PROD_JWT_SECRET:?JWT secret must be specified}
      GEMINI_API_KEY: ${PROD_GEMINI_API_KEY:?Gemini AI API Key required}
    deploy:
      replicas: 2 # High-availability API replicas
      update_config:
        parallelism: 1
        order: start-first
      resources:
        limits:
          cpus: '1.50'
          memory: 2048M
    depends_on:
      - postgres
      - kafka
    networks:
      - haps-prod-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: haps-scholar-assistant/frontend:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    deploy:
      replicas: 2
    depends_on:
      - backend
    networks:
      - haps-prod-network

networks:
  haps-prod-network:
    driver: overlay
    attachable: true

volumes:
  prod_postgres_data:
    driver: local
  prod_kafka_data:
    driver: local
