apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - postgres.yaml
  - kafka.yaml
  - backend.yaml
  - frontend.yaml

configMapGenerator:
  - name: haps-config
    literals:
      - DB_NAME=haps_scholar_db
      - DB_USER=haps_admin
      - LOG_LEVEL=info

secretGenerator:
  - name: haps-secrets
    literals:
      - DB_PASSWORD=haps_secure_password_2026
      - DATABASE_URL=postgres://haps_admin:haps_secure_password_2026@postgres:5432/haps_scholar_db
      - JWT_SECRET=haps_production_jwt_signing_key_2026
      - GEMINI_API_KEY=AIzaSyB_SampleKeyForHapsPilotProduction
