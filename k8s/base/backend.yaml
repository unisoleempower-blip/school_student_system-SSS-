apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: haps-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: haps-backend
  template:
    metadata:
      labels:
        app: haps-backend
    spec:
      containers:
      - name: backend
        image: haps-scholar-assistant/backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: PORT
          value: "5000"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: haps-secrets
              key: DATABASE_URL
        - name: KAFKA_BROKERS
          value: "kafka:9092"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: haps-secrets
              key: JWT_SECRET
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: haps-secrets
              key: GEMINI_API_KEY
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: haps-backend
spec:
  ports:
  - port: 5000
    targetPort: 5000
    name: http
  selector:
    app: haps-backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
