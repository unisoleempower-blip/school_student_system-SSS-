apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: haps-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: haps-frontend
  template:
    metadata:
      labels:
        app: haps-frontend
    spec:
      containers:
      - name: frontend
        image: haps-scholar-assistant/frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: haps-frontend
spec:
  ports:
  - port: 80
    targetPort: 80
    name: http
  selector:
    app: haps-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: haps-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  rules:
  - host: scholar.himacademy.ac.in
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
