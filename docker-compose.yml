version: '3.8'

services:
  # 1. PRIMARY RELATIONAL DATABASE (POSTGRESQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: haps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: haps_scholar_db
      POSTGRES_USER: haps_admin
      POSTGRES_PASSWORD: haps_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haps_admin -d haps_scholar_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - haps-network

  # 2. EVENT STREAMING BUS (APACHE KAFKA IN KRAFT MODE - NO ZOOKEEPER)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: haps-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - haps-network

  # 3. CORE BACKEND & TELEMETRY STREAM WORKER
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: haps-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: staging
      PORT: 5000
      DATABASE_URL: postgres://haps_admin:haps_secure_password_2026@postgres:5432/haps_scholar_db
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: haps_super_secret_jwt_key_2026_him_academy
      GEMINI_API_KEY: ${GEMINI_API_KEY:-mock_key_for_offline_eval}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - haps-network

  # 4. FRONTEND WEB PORTAL
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: haps-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      BACKEND_URL: http://localhost:5000
    depends_on:
      - backend
    networks:
      - haps-network

networks:
  haps-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local
