name: CI/CD Pipeline - School Student System (SSS)

on:
  push:
    branches: [ main, staging, develop ]
  pull_request:
    branches: [ main, staging ]

jobs:
  # ============================================================================
  # JOB 1: TEST & DIAGNOSTICS SUITE
  # ============================================================================
  test-and-verify:
    name: Run Academic Services Verification Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package.json
            backend/package.json

      - name: Install Dependencies
        run: |
          npm ci || npm install
          cd backend && (npm ci || npm install)

      - name: Execute Service Diagnostic Tests
        run: npm test

  # ============================================================================
  # JOB 2: DOCKER IMAGE BUILD VERIFICATION
  # ============================================================================
  docker-build:
    name: Build & Verify Production Docker Containers
    needs: test-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: haps-scholar/backend:test

      - name: Build Frontend Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: haps-scholar/frontend:test

  # ============================================================================
  # JOB 3: KUBERNETES MANIFEST VALIDATION (STAGING & PRODUCTION)
  # ============================================================================
  k8s-validate:
    name: Validate Kubernetes Kustomize Overlays
    needs: test-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Validate Staging Kustomize Overlay
        run: kubectl kustomize k8s/overlays/staging > /dev/null

      - name: Validate Production Kustomize Overlay
        run: kubectl kustomize k8s/overlays/production > /dev/null
