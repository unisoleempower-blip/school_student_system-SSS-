name: Vercel Staging & Production Safe Release Pipeline

on:
  push:
    branches: [ staging, main ]
  pull_request:
    branches: [ staging, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # STAGE 1: LOCAL DIAGNOSTICS & UNIT SUITE
  # ============================================================================
  pre-deploy-diagnostics:
    name: Pre-Flight Academic Diagnostic Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Execute Diagnostic Engine Tests
        run: node scripts/test_evaluator.js

  # ============================================================================
  # STAGE 2: DEPLOY TO STAGING / PREVIEW ENVIRONMENT
  # ============================================================================
  deploy-staging:
    name: Deploy to Vercel Staging Environment
    needs: pre-deploy-diagnostics
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.deploy-preview.outputs.preview-url }}
      has_secrets: ${{ steps.check-secrets.outputs.has_secrets }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Vercel Authentication Secrets
        id: check-secrets
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
            echo "✅ Vercel authentication secrets detected."
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "::warning ::Vercel credentials are not configured in GitHub Secrets. Staging deployment will be skipped in Actions."
          fi

      - name: Deploy to Vercel Staging
        if: steps.check-secrets.outputs.has_secrets == 'true'
        id: deploy-preview
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: ''
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-comment: true

  # ============================================================================
  # STAGE 3: AUTOMATED STAGING ENVIRONMENT VERIFICATION (THE SAFETY GATE)
  # ============================================================================
  verify-staging:
    name: Verify Staging Environment Health & Smoke Tests
    needs: deploy-staging
    if: needs.deploy-staging.outputs.has_secrets == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Staging Verification Suite
        env:
          STAGING_URL: ${{ needs.deploy-staging.outputs.preview_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Verifying Staging URL: $STAGING_URL"
          node scripts/verify_staging.js "$STAGING_URL"

  # ============================================================================
  # STAGE 4: PROMOTE TO PRODUCTION (STRICTLY GATED BY STAGING VERIFICATION)
  # ============================================================================
  promote-to-production:
    name: Promote & Deploy to Vercel Production
    needs: [ deploy-staging, verify-staging ]
    if: |
      needs.deploy-staging.outputs.has_secrets == 'true' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-comment: true

      - name: Production Verification Health Check
        run: |
          sleep 5
          curl -s -S "https://haps-ai-scholar-assistant.vercel.app/api/health" | grep -q "HEALTHY" && echo "✅ Production Gateway Verified HEALTHY!"
